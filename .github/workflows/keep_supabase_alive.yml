name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase
        run: |
          curl -s -X GET "$URL/rest/v1/chongqingZ_inferred_buildings?limit=1" \
          -H "apikey: $KEY" \
          -H "Authorization: Bearer $KEY"